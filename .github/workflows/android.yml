name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Pinned to prevent Ubuntu 26 migration surprises

    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # Node 24 compatible

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # Node 24 compatible, replaces deprecated v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5 # Node 24 compatible
        with:
          name: countdown-video-apk
          path: app/build/outputs/apk/debug/app-debug.apk
